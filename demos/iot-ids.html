<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital IoT Guard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&family=Fragment+Mono&display=swap">
<style>
/* Live simulation of the IoT hospital IDS: real CICIoT2023 flows replayed through the project's real decision tree (exported from scikit-learn). */
:root{
  --bg:#F3ECE3; --surface:#FFFAF4; --surface-2:#F8F0E6; --line:#E4D5C3;
  --text:#2A1C13; --muted:#86705D; --accent:#8A5634; --on-accent:#FFF8F0; --gold:#A86A22;
  --ok:#2F8F5B; --ok-soft:#DDEFE2; --bad:#C23B2E; --bad-soft:#F8DCD6; --warn:#B7791F; --warn-soft:#F7E7C8;
  --wire:#D9C6B0; --node:#FFFDF9;
  --display:'Fraunces',Georgia,serif; --body:'Instrument Sans',system-ui,sans-serif; --mono:'Fragment Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#130E0B; --surface:#1D1611; --surface-2:#251C16; --line:#392B21;
  --text:#F4EADF; --muted:#A8927C; --accent:#D69B69; --on-accent:#1A110B; --gold:#E6B46C;
  --ok:#5FC28A; --ok-soft:#1B3325; --bad:#F06A5B; --bad-soft:#3E1D18; --warn:#E6B46C; --warn-soft:#3A2C17;
  --wire:#4A382B; --node:#251C16; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#130E0B; --surface:#1D1611; --surface-2:#251C16; --line:#392B21;
  --text:#F4EADF; --muted:#A8927C; --accent:#D69B69; --on-accent:#1A110B; --gold:#E6B46C;
  --ok:#5FC28A; --ok-soft:#1B3325; --bad:#F06A5B; --bad-soft:#3E1D18; --warn:#E6B46C; --warn-soft:#3A2C17;
  --wire:#4A382B; --node:#251C16; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--body);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 28px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{font:600 clamp(22px,3.2vw,30px)/1.1 var(--display);margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:62ch}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:6px 12px;font-weight:600;font-size:12px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.controls{padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.controls .lbl{font-size:12px;font-weight:600;color:var(--muted);margin-right:2px}
.scen{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;display:inline-flex;gap:7px;align-items:center}
.scen i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.scen.atk i{background:var(--bad)}
.scen[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.scen[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--on-accent)}
.sp{flex:1}
.ghost{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 12px;font-weight:600;font-size:12.5px}
.ghost.primary{background:var(--text);color:var(--bg);border-color:var(--text)}

.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}
@media (max-width:880px){.grid{grid-template-columns:1fr}}
.panel{padding:14px}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.ptitle h2{font:600 16px/1.2 var(--display);margin:0}
.ptitle small{color:var(--muted);font-size:12px}

#banner{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-weight:600;display:flex;gap:10px;align-items:center;background:var(--ok-soft);color:var(--ok);transition:background .3s,color .3s}
#banner.alert{background:var(--bad-soft);color:var(--bad)}
#banner .dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
#banner.alert .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
#scenDesc{color:var(--muted);font-size:13px;margin:0 0 8px;min-height:2.9em}

svg#net{width:100%;height:auto;display:block}
.wire{stroke:var(--wire);stroke-width:2}
.wire.atk{stroke:var(--bad);stroke-dasharray:5 5;opacity:.75}
.zone{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 6}
.zlabel{fill:var(--muted);font:600 10px var(--body);letter-spacing:.14em;text-transform:uppercase}
.dev{cursor:pointer}
.dev circle.body{fill:var(--node);stroke:var(--line);stroke-width:2;transition:stroke .2s}
.dev:hover circle.body,.dev:focus circle.body{stroke:var(--accent)}
.dev.target circle.body{stroke:var(--gold);stroke-width:3}
.dev .halo{fill:var(--bad);opacity:0;transition:opacity .3s}
.dev.hit .halo{opacity:.22}
.dev text{fill:var(--text);font:600 11px var(--body);text-anchor:middle}
.dev text.ico{font-size:20px}
.dev text.tgt{fill:var(--gold);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.gw circle.body{fill:var(--accent);stroke:none}
.gw text{fill:var(--on-accent)}
.gw .ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:0}
.hacker circle.body{fill:var(--bad-soft);stroke:var(--bad)}
.hacker{cursor:default}
.pkt{r:4.5}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.stat b{display:block;font:600 22px/1.1 var(--display)}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}

#log{list-style:none;margin:0;padding:0;max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:12px}
#log li{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
#log li:last-child{border-bottom:0}
#log li:hover{background:var(--surface-2)}
#log li.sel{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
#log .t{font:12px var(--mono);color:var(--muted)}
#log .who b{font-weight:600}
#log .who small{display:block;color:var(--muted);font-size:11.5px}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap}
.chip.caught{background:var(--bad-soft);color:var(--bad)}
.chip.missed{background:var(--warn-soft);color:var(--warn)}
.chip.fa{background:var(--warn-soft);color:var(--warn)}
.chip.clean{background:var(--ok-soft);color:var(--ok)}

#why{margin-top:12px}
.why-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.why-head h3{font:600 14.5px var(--display);margin:0}
#whyVerdict{font-size:13px;margin:0 0 8px}
#path{list-style:none;margin:0;padding:0;counter-reset:s;max-height:230px;overflow:auto}
#path li{counter-increment:s;display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
#path li::before{content:counter(s);font:11px var(--mono);color:var(--muted);text-align:right}
#path .f{font-weight:600}
#path .f small{font-weight:400;color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:4px}
#path .cmp{font:12px var(--mono);white-space:nowrap}
#path li.leaf{border-bottom:0;font-weight:600}
#path li.leaf::before{content:"→"}
.foot{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.55}
.foot b{color:var(--text);font-weight:600}
@media (prefers-reduced-motion:reduce){#banner.alert .dot{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="fr">FR</button>
    </div>
  </header>

  <div class="card controls">
    <span class="lbl" data-t="traffic"></span>
    <button type="button" class="scen" data-scen="normal"><i></i><span data-t="s_normal"></span></button>
    <button type="button" class="scen atk" data-scen="DDoS-TCP_Flood"><i></i><span data-t="s_ddos"></span></button>
    <button type="button" class="scen atk" data-scen="DNS_Spoofing"><i></i><span data-t="s_dns"></span></button>
    <button type="button" class="scen atk" data-scen="Recon-PortScan"><i></i><span data-t="s_scan"></span></button>
    <span class="sp"></span>
    <button type="button" class="ghost primary" id="tour" data-t="tour"></button>
    <button type="button" class="ghost" id="pause"></button>
    <button type="button" class="ghost" id="speed"></button>
    <button type="button" class="ghost" id="reset" data-t="reset"></button>
  </div>

  <div class="grid">
    <section class="card panel">
      <div id="banner" role="status" aria-live="polite"><span class="dot"></span><span id="bannerText"></span></div>
      <p id="scenDesc"></p>
      <svg id="net" viewBox="0 0 600 400" role="img" aria-label="Hospital network map">
        <rect class="zone" x="12" y="40" width="440" height="348" rx="18"/>
        <text class="zlabel" x="30" y="62" data-t="zone"></text>
        <g id="wires"></g>
        <g id="nodes"></g>
        <g id="pkts"></g>
      </svg>
      <p style="margin:2px 0 0;color:var(--muted);font-size:12px" data-t="pick"></p>
      <div class="stats">
        <div class="stat"><b id="nFlows">0</b><span data-t="st_flows"></span></div>
        <div class="stat ok"><b id="nCaught">0</b><span data-t="st_caught"></span></div>
        <div class="stat warn"><b id="nMissed">0</b><span data-t="st_missed"></span></div>
        <div class="stat warn"><b id="nFa">0</b><span data-t="st_fa"></span></div>
      </div>
    </section>

    <section class="card panel">
      <div class="ptitle"><h2 data-t="log_title"></h2><small id="recall"></small></div>
      <ul id="log" aria-live="off"></ul>
      <div id="why">
        <div class="why-head"><h3 data-t="why_title"></h3><button type="button" class="ghost" id="follow" hidden data-t="follow"></button></div>
        <p id="whyVerdict"></p>
        <ol id="path"></ol>
      </div>
    </section>
  </div>

  <p class="foot" id="foot"></p>
</div>

      'Time_To_Live':'Durée de vie (TTL)','IAT':'Temps entre paquets','Rate':'Paquets par seconde','Header_Length':'Longueur d’en-tête','Protocol Type':'Numéro de protocole','Number':'Paquets dans la fenêtre',
      'syn_flag_number':'Drapeaux SYN (part)','ack_flag_number':'Drapeaux ACK (part)','fin_flag_number':'Drapeaux FIN (part)','rst_flag_number':'Drapeaux RST (part)','psh_flag_number':'Drapeaux PSH (part)',
      'ece_flag_number':'Drapeaux ECE (part)','cwr_flag_number':'Drapeaux CWR (part)','syn_count':'Nombre de SYN','ack_count':'Nombre d’ACK','fin_count':'Nombre de FIN','rst_count':'Nombre de RST' },
  };
  const BYTES = new Set(['Max', 'Min', 'AVG', 'Tot size', 'Tot sum']);

  const params = new URLSearchParams(location.search);
  let lang = params.get('lang') === 'fr' ? 'fr' : (params.get('lang') === 'en' ? 'en' : ((navigator.language || '').startsWith('fr') ? 'fr' : 'en'));
  const theme = params.get('theme');
  if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;

  const T = (k, o) => (I18N[lang][k] ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g, (m, x) => (o && o[x] != null ? o[x] : ''));
  const $ = (s) => document.querySelector(s);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- the model: walk the exported scikit-learn tree ----------
  function predict(raw) {
    const path = [];
    let n = 0;
    while (TREE.left[n] !== -1) {
      const f = TREE.feature[n];
      const z = (raw[f] - TREE.mean[f]) / TREE.scale[f];   // same StandardScaler as in training
      const yes = z <= TREE.threshold[n];
      path.push({ f, raw: raw[f], thr: TREE.threshold[n] * TREE.scale[f] + TREE.mean[f], yes });
      n = yes ? TREE.left[n] : TREE.right[n];
    }
    const [p0, p1] = TREE.value[n];
    const attack = p1 > p0;
    return { attack, conf: Math.round(100 * Math.max(p0, p1) / (p0 + p1)), path };
  }

  // ---------- network ----------
  const DEVICES = [
    { id: 'ecg', ico: '❤', x: 110, y: 120 },
    { id: 'pump', ico: '💧', x: 330, y: 105 },
    { id: 'cam', ico: '📷', x: 395, y: 245 },
    { id: 'tab', ico: '📱', x: 250, y: 340 },
    { id: 'bed', ico: '🛏', x: 80, y: 285 },
  ];
  const GW = { x: 230, y: 215 };
  const HK = { x: 540, y: 90 };
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

  let target = 'pump';
  const devNodes = {};
  let atkWire;

  function drawNet() {
    const wires = $('#wires'), nodes = $('#nodes');
    wires.innerHTML = ''; nodes.innerHTML = '';
    DEVICES.forEach((d) => el('line', { class: 'wire', x1: d.x, y1: d.y, x2: GW.x, y2: GW.y }, wires));
    const t = DEVICES.find((d) => d.id === target);
    atkWire = el('line', { class: 'wire atk', x1: HK.x, y1: HK.y, x2: t.x, y2: t.y }, wires);
    atkWire.style.display = scen === 'normal' ? 'none' : '';

    const gw = el('g', { class: 'dev gw' }, nodes);
    gw.ring = el('circle', { class: 'ring', cx: GW.x, cy: GW.y, r: 34 }, gw);
    el('circle', { class: 'body', cx: GW.x, cy: GW.y, r: 34 }, gw);
    el('text', { x: GW.x, y: GW.y - 3 }, gw).textContent = T('gw2');
    const g2 = el('text', { x: GW.x, y: GW.y + 12, style: 'font-size:9.5px;font-weight:500' }, gw); g2.textContent = T('gw');
    devNodes.gw = gw;

    DEVICES.forEach((d) => {
      const g = el('g', { class: 'dev' + (d.id === target ? ' target' : ''), tabindex: 0, role: 'button', 'aria-label': T('d_' + d.id) }, nodes);
      el('circle', { class: 'halo', cx: d.x, cy: d.y, r: 40 }, g);
      el('circle', { class: 'body', cx: d.x, cy: d.y, r: 27 }, g);
      el('text', { class: 'ico', x: d.x, y: d.y + 7 }, g).textContent = d.ico;
      el('text', { x: d.x, y: d.y + 44 }, g).textContent = T('d_' + d.id);
      if (d.id === target) el('text', { class: 'tgt', x: d.x, y: d.y - 34 }, g).textContent = '◎ ' + T('target');
      const pick = () => { target = d.id; drawNet(); describe(); };
      g.addEventListener('click', pick);
      g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      devNodes[d.id] = g;
    });

    const hk = el('g', { class: 'dev hacker' }, nodes);
    el('circle', { class: 'body', cx: HK.x, cy: HK.y, r: 27 }, hk);
    el('text', { class: 'ico', x: HK.x, y: HK.y + 7 }, hk).textContent = '☠';
    el('text', { x: HK.x, y: HK.y + 44 }, hk).textContent = T('hacker');
    hk.style.opacity = scen === 'normal' ? .35 : 1;
    devNodes.hk = hk;
  }

  // packets: small dots travelling along a line
  const pkts = [];
  function sendPkt(from, to, color, ms, done) {
    // the timer drives the simulation, the dot is only decoration (keeps working when animations are throttled)
    const dur = ms / speedMul();
    if (done) setTimeout(done, reduced ? 0 : dur);
    if (reduced) return;
    const c = el('circle', { class: 'pkt', r: 4.5, cx: from.x, cy: from.y, fill: color }, $('#pkts'));
    pkts.push({ c, from, to, t0: performance.now(), ms: dur });
  }
  function frame(now) {
    for (let i = pkts.length - 1; i >= 0; i--) {
      const p = pkts[i];
      const k = Math.min(1, (now - p.t0) / p.ms);
      p.c.setAttribute('cx', p.from.x + (p.to.x - p.from.x) * k);
      p.c.setAttribute('cy', p.from.y + (p.to.y - p.from.y) * k);
      if (k >= 1) { p.c.remove(); pkts.splice(i, 1); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- simulation ----------
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const SHORT = { 'Benign_Final': 'benign', 'DDoS-TCP_Flood': 'ddos', 'DNS_Spoofing': 'dns', 'Recon-PortScan': 'scan' };
  const queues = {};
  const take = (cls) => {
    if (!queues[cls] || !queues[cls].length) queues[cls] = SAMPLES[cls].map((_, i) => i).sort(() => Math.random() - .5);
    return SAMPLES[cls][queues[cls].pop()];
  };

  let scen = 'normal', paused = false, speedIdx = 0, timer = null, clock = 0, seq = 0;
  const SPEEDS = [1, 2.5];
  const speedMul = () => SPEEDS[speedIdx];
  const stats = { flows: 0, atk: 0, caught: 0, missed: 0, fa: 0 };
  const flows = [];
  let selected = null, follow = true, hitTimer = null;

  function tick() {
    clock += 1;
    let cls, dev;
    if (scen !== 'normal' && Math.random() < .72) { cls = scen; dev = target; }
    else {
      cls = 'Benign_Final';
      const others = scen === 'normal' ? DEVICES : DEVICES.filter((d) => d.id !== target);
      dev = others[Math.floor(Math.random() * others.length)].id;
    }
    const raw = take(cls);
    const res = predict(raw);
    const isAtk = cls !== 'Benign_Final';
    const flow = { id: ++seq, clock, cls, dev, raw, ...res, isAtk };
    flow.out = isAtk ? (res.attack ? 'caught' : 'missed') : (res.attack ? 'fa' : 'clean');

    const d = DEVICES.find((x) => x.id === dev);
    const verdictColor = res.attack ? css('--bad') : css('--ok');
    const toGateway = () => sendPkt(d, GW, verdictColor, 700, () => land(flow));
    if (isAtk) sendPkt(HK, d, css('--bad'), 650, toGateway);
    else toGateway();
  }

  function land(flow) {
    stats.flows++;
    if (flow.isAtk) stats.atk++;
    if (flow.out === 'caught') stats.caught++;
    if (flow.out === 'missed') stats.missed++;
    if (flow.out === 'fa') stats.fa++;
    flows.unshift(flow); if (flows.length > 60) flows.pop();
    const gw = devNodes.gw;
    if (gw && gw.ring && !reduced) gw.ring.animate([{ opacity: .8, r: 34 }, { opacity: 0, r: 52 }], { duration: 600 });
    if (flow.attack) {
      Object.values(devNodes).forEach((g) => g.classList && g.classList.remove('hit'));
      devNodes[flow.dev] && devNodes[flow.dev].classList.add('hit');
      setBanner(flow);
      clearTimeout(hitTimer);
      hitTimer = setTimeout(() => { devNodes[flow.dev] && devNodes[flow.dev].classList.remove('hit'); setBanner(null); }, 2600 / speedMul());
    }
    renderStats(); renderLog();
    if (follow) showWhy(flow);
  }

  function setBanner(flow) {
    const b = $('#banner');
    if (!flow) { b.classList.remove('alert'); $('#bannerText').textContent = T('b_calm'); return; }
    b.classList.add('alert');
    $('#bannerText').textContent = T(flow.isAtk ? 'b_alert' : 'b_fa', { dev: T('d_' + flow.dev).toLowerCase() });
  }

  function renderStats() {
    $('#nFlows').textContent = stats.flows;
    $('#nCaught').textContent = stats.caught;
    $('#nMissed').textContent = stats.missed;
    $('#nFa').textContent = stats.fa;
    $('#recall').textContent = stats.atk ? T('recall', { r: Math.round(100 * stats.caught / stats.atk) }) : '';
  }

  function renderLog() {
    const ul = $('#log');
    ul.innerHTML = '';
    flows.forEach((f) => {
      const li = document.createElement('li');
      if (selected && selected.id === f.id && !follow) li.className = 'sel';
      const mm = String(Math.floor(f.clock / 60)).padStart(2, '0') + ':' + String(f.clock % 60).padStart(2, '0');
      li.innerHTML = `<span class="t">${mm}</span><span class="who"><b></b><small></small></span><span class="chip ${f.out}"></span>`;
      li.querySelector('b').textContent = T('d_' + f.dev);
      li.querySelector('small').textContent = T('real') + ' ' + T('l_' + SHORT[f.cls]);
      li.querySelector('.chip').textContent = T(f.out);
      li.addEventListener('click', () => { follow = false; $('#follow').hidden = false; showWhy(f); renderLog(); });
      ul.appendChild(li);
    });
  }

  const fmt = (v) => {
    const a = Math.abs(v);
    if (a === 0) return '0';
    if (Number.isInteger(v) || a >= 1000) return v.toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-US', { maximumFractionDigits: 0 });
    if (a >= 10) return v.toFixed(1);
    if (a >= 0.01) return v.toFixed(3).replace(/\.?0+$/, '');
    return v.toExponential(1);
  };

  function showWhy(f) {
    selected = f;
    if (!f) { $('#whyVerdict').textContent = T('why_none'); $('#path').innerHTML = ''; return; }
    const v = f.attack ? T('v_atk') : T('v_ok');
    $('#whyVerdict').textContent = T('why_v', { n: f.path.length, v, c: f.conf });
    const ol = $('#path');
    ol.innerHTML = '';
    f.path.forEach((s) => {
      const name = TREE.features[s.f];
      const unit = BYTES.has(name) ? ' B' : '';
      const li = document.createElement('li');
      li.innerHTML = '<span class="f"></span><span class="cmp"></span>';
      li.querySelector('.f').textContent = (FEAT[lang][name] || name);
      const sm = document.createElement('small'); sm.textContent = name; li.querySelector('.f').appendChild(sm);
      li.querySelector('.cmp').textContent = `${fmt(s.raw)}${unit} ${s.yes ? '≤' : '>'} ${fmt(s.thr)}${unit}`;
      ol.appendChild(li);
    });
    const leaf = document.createElement('li');
    leaf.className = 'leaf';
    leaf.innerHTML = '<span></span><span class="cmp"></span>';
    leaf.firstChild.textContent = T('leaf', { v });
    leaf.firstChild.style.color = f.attack ? 'var(--bad)' : 'var(--ok)';
    ol.appendChild(leaf);
  }

  function describe() {
    const key = scen === 'normal' ? 'desc_normal' : 'desc_' + scen.split(/[-_]/)[0];
    $('#scenDesc').textContent = T(key, { dev: T('d_' + target).toLowerCase() });
  }

  function setScen(s) {
    scen = s;
    document.querySelectorAll('.scen').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.scen === s)));
    if (atkWire) atkWire.style.display = s === 'normal' ? 'none' : '';
    if (devNodes.hk) devNodes.hk.style.opacity = s === 'normal' ? .35 : 1;
    describe();
  }

  function schedule() {
    clearInterval(timer);
    if (!paused) timer = setInterval(tick, 1100 / speedMul());
  }

  // guided story: calm, then each attack in turn, then calm again
  let tourTimers = [];
  function stopTour() { tourTimers.forEach(clearTimeout); tourTimers = []; $('#tour').textContent = T('tour'); }
  function playTour() {
    if (tourTimers.length) { stopTour(); return; }
    resetAll();
    $('#tour').textContent = T('tour_stop');
    const steps = [['normal', 0], ['DDoS-TCP_Flood', 7], ['DNS_Spoofing', 19], ['Recon-PortScan', 31], ['normal', 45]];
    steps.forEach(([s, sec]) => tourTimers.push(setTimeout(() => setScen(s), sec * 1000)));
    tourTimers.push(setTimeout(stopTour, 52000));
    if (paused) { paused = false; renderControls(); schedule(); }
  }

  function resetAll() {
    Object.assign(stats, { flows: 0, atk: 0, caught: 0, missed: 0, fa: 0 });
    flows.length = 0; clock = 0; follow = true; $('#follow').hidden = true;
    renderStats(); renderLog(); showWhy(null); setBanner(null);
  }

  function renderControls() {
    $('#pause').textContent = paused ? T('play') : T('pause');
    $('#speed').textContent = `${T('speed')} ×${SPEEDS[speedIdx]}`;
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach((n) => { n.textContent = T(n.dataset.t); });
    document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    if (tourTimers.length) $('#tour').textContent = T('tour_stop');
    $('#foot').innerHTML = T('foot');
    drawNet(); describe(); renderControls(); renderStats(); renderLog();
    showWhy(selected); setBanner(null);
  }

  document.querySelectorAll('.scen').forEach((b) => b.addEventListener('click', () => { stopTour(); setScen(b.dataset.scen); }));
  document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; applyLang(); }));
  $('#tour').addEventListener('click', playTour);
  $('#pause').addEventListener('click', () => { paused = !paused; renderControls(); schedule(); });
  $('#speed').addEventListener('click', () => { speedIdx = (speedIdx + 1) % SPEEDS.length; renderControls(); schedule(); });
  $('#reset').addEventListener('click', () => { stopTour(); setScen('normal'); resetAll(); });
  $('#follow').addEventListener('click', () => { follow = true; $('#follow').hidden = true; showWhy(flows[0] || null); renderLog(); });

  setScen(I18N.en['s_' + SHORT[params.get('scen')]] ? params.get('scen') : 'normal');
  applyLang();
  schedule();
})();
</script>
</body>
</html>
