# Cloudflare Worker config for the AI question box (free, no API key needed).
# Deploy:  cd ai  →  npm install  →  npx wrangler login  →  npx wrangler deploy
name = "query-sara-ai"
main = "worker.js"
compatibility_date = "2026-09-01"

# Cloudflare Workers AI: free AI models that run inside the worker
[ai]
binding = "AI"

# data/sara.sql is bundled into the worker, so the AI always knows your latest data.
# After you edit sara.sql, run `npx wrangler deploy` again.
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[vars]
# Websites allowed to use the worker. Live Server runs on port 5500.
# Add your GitHub Pages address when the site is online.
ALLOWED_ORIGINS = "http://127.0.0.1:5500,http://localhost:5500,https://siriusralph.github.io"
